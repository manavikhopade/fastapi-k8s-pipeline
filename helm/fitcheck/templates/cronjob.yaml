{{- if .Values.cronjob.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: fitcheck-weekly-analysis
spec:
  schedule: "{{ .Values.cronjob.schedule }}"
  successfulJobsHistoryLimit: {{ .Values.cronjob.successfulJobsHistoryLimit | default 3 }}
  failedJobsHistoryLimit: {{ .Values.cronjob.failedJobsHistoryLimit | default 1 }}
  jobTemplate:
    spec:
      backoffLimit: {{ .Values.cronjob.backoffLimit | default 3 }}
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: run-analysis
              image: {{ .Values.cronjob.image | quote }}
              command:
{{- range $i, $c := .Values.cronjob.command }}
                - {{ $c | quote }}
{{- end }}
          # ensure the CronJob runs in the same namespace as the release
          # (Helm will set metadata.namespace when installing)
{{- end }}
