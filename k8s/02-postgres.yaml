# Headless Service — a stable network name "postgres" for the DB
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: fitcheck
spec:
  clusterIP: None
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: fitcheck
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16
          ports:
            - containerPort: 5432
          envFrom:
            - secretRef:
                name: db-secret          # inject the DB user/pass/name
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata   # store data in a subfolder
          volumeMounts:
            - name: pgdata
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "fituser", "-d", "fitcheck"]
            initialDelaySeconds: 5
            periodSeconds: 5
  volumeClaimTemplates:                    # ← this creates the PVC (persistent storage)
    - metadata:
        name: pgdata
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
