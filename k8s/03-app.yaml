apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
  namespace: fitcheck
spec:
  replicas: 2                              # run 2 copies for availability
  selector:
    matchLabels:
      app: fitcheck-app
  template:
    metadata:
      labels:
        app: fitcheck-app
    spec:
      containers:
        - name: app
          image: fitcheck:dev
          imagePullPolicy: IfNotPresent    # use the locally-loaded image, don't pull
          ports:
            - containerPort: 8000
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: DATABASE_URL
          readinessProbe:                  # don't send traffic until /health is ok
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:                   # restart the pod if /health stops responding
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits:   { cpu: 250m, memory: 256Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: app
  namespace: fitcheck
spec:
  selector:
    app: fitcheck-app
  ports:
    - port: 8000
      targetPort: 8000
  type: ClusterIP
